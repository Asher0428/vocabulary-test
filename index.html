<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생존영어</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#f3f5f7;--card:#fff;--text:#17191c;--muted:#6b7280;--line:#e2e6ea;--primary:#1f2328;--soft:#eef0f2;--danger:#b42318;--success:#16803c}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    .app{width:min(94%,860px);margin:24px auto 36px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:38px}
    .top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
    .home-btn,.admin-btn{border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700}
    .home-btn{padding:9px 13px}
    .admin-btn{padding:7px 10px;font-size:12px;line-height:1}
    .card{background:var(--card);border-radius:8px;padding:26px;box-shadow:0 10px 28px rgba(0,0,0,.07)}
    .hidden{display:none!important}
    h1,h2{margin:0 0 18px}
    h1{text-align:center;font-size:34px;font-weight:900}
    h2{font-size:24px}
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
    .menu-btn{min-height:146px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:22px;text-align:left;transition:.15s}
    .menu-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.06)}
    .menu-btn:focus-visible,.home-btn:focus-visible,.admin-btn:focus-visible,.primary-btn:focus-visible,.secondary-btn:focus-visible,.danger-btn:focus-visible,.choice-btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px}
    .menu-title{display:block;font-size:23px;font-weight:800;margin-bottom:9px}
    .menu-desc{color:var(--muted);line-height:1.55;font-size:14px}
    .section-note{color:var(--muted);font-size:14px;line-height:1.6;margin:-6px 0 18px}
    .primary-btn,.secondary-btn,.danger-btn{border:0;border-radius:8px;padding:12px 16px;font-weight:800}
    .primary-btn{background:var(--primary);color:#fff}
    .secondary-btn{background:var(--soft)}
    .danger-btn{background:#fff0f0;color:var(--danger)}
    .full{width:100%}
    .status{margin-top:12px;min-height:21px;font-size:14px;color:var(--muted)}
    .status.success{color:var(--success)}
    .status.error{color:var(--danger)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
    .word-count{font-weight:800}
    .word-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
    table{width:100%;border-collapse:collapse;min-width:620px}
    th,td{text-align:center;padding:13px 15px;border-bottom:1px solid var(--line)}
    th{background:#f7f8fa;font-size:14px}
    tr:last-child td{border-bottom:0}
    .form-group{margin-bottom:18px}
    label{display:block;font-weight:800;margin-bottom:8px}
    input[type=number],input[type=text],input[type=password],select{width:100%;padding:13px 14px;border:1px solid #d5d9dd;border-radius:8px;background:#fff;font-size:16px}
    .selector-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
    .book-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
    .day-select-row{display:grid;grid-template-columns:minmax(180px,260px);gap:8px;margin:14px 0 18px}
    .check-panel{border:1px solid var(--line);border-radius:8px;background:#fafbfc;padding:14px;min-height:120px}
    .check-panel-title{font-weight:800;margin-bottom:10px}
    .check-list{display:grid;gap:8px}
    .check-item{display:flex;align-items:center;gap:8px;color:var(--text);line-height:1.4}
    .check-item input{width:16px;height:16px;flex:0 0 auto}
    .range-list{display:grid;gap:12px}
    .range-item{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px}
    .range-title{font-weight:800;margin-bottom:8px}
    .range-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
    .range-controls span{text-align:center;color:var(--muted);font-weight:800}
    .meta-pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;color:var(--muted);margin:0 5px 6px 0}
    .vocab-day-title{font-size:20px;font-weight:900;margin:12px 0}
    .progress{text-align:center;color:var(--muted);font-size:14px;font-weight:700}
    .question-word{text-align:center;font-size:39px;font-weight:900;margin:31px 0;word-break:break-word}
    .choices{display:grid;gap:11px}
    .choice-btn{width:100%;border:1px solid var(--line);border-radius:8px;background:#f8f9fa;padding:14px;text-align:center;font-weight:700}
    .choice-btn.selected{color:#fff;background:var(--primary);border-color:var(--primary)}
    .navigation{display:flex;gap:10px;margin-top:22px}
    .navigation button{flex:1}
    .score{text-align:center;font-size:34px;font-weight:900;margin:22px 0}
    .answer-item{border:1px solid var(--line);border-radius:8px;padding:15px;margin-bottom:11px}
    .answer-item.correct{border-left:6px solid var(--success)}
    .answer-item.wrong{border-left:6px solid #d64545}
    .answer-item p{margin:5px 0;line-height:1.5}
    .result-actions{display:grid;gap:10px;margin-top:18px}
    .modal-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(23,25,28,.42);padding:18px}
    .auth-dialog{width:min(100%,360px);background:#fff;border-radius:8px;padding:22px;box-shadow:0 18px 42px rgba(0,0,0,.2)}
    .auth-dialog h2{font-size:21px;margin-bottom:8px}
    .auth-actions{display:flex;gap:10px;margin-top:14px}
    .auth-actions button{flex:1}
    @media(max-width:680px){
      .app{margin:14px auto 24px}
      .card{padding:20px}
      h1{font-size:30px}
      .menu-grid,.selector-grid,.book-grid{grid-template-columns:1fr}
      .menu-btn{min-height:118px}
      .question-word{font-size:32px}
      .navigation{flex-direction:column}
      .toolbar{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <button id="homeBtn" class="home-btn hidden" type="button">Home</button>
    <div class="top-actions">
      <button id="adminSettingsBtn" class="admin-btn" type="button">Admin Settings</button>
    </div>
  </div>

  <div id="adminAuthModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="adminAuthTitle">
    <div class="auth-dialog">
      <h2 id="adminAuthTitle">Admin Settings</h2>
      <p class="section-note">비밀번호를 입력하세요.</p>
      <label for="adminPasswordInput">비밀번호</label>
      <input id="adminPasswordInput" type="password" inputmode="numeric" autocomplete="off" />
      <div id="adminPasswordStatus" class="status"></div>
      <div class="auth-actions">
        <button id="cancelAdminAuthBtn" class="secondary-btn" type="button">취소</button>
        <button id="confirmAdminAuthBtn" class="primary-btn" type="button">확인</button>
      </div>
    </div>
  </div>

  <section id="homePage" class="card">
    <h1>생존영어</h1>
    <div class="menu-grid">
      <button id="openVocabularyBtn" class="menu-btn" type="button">
        <span class="menu-title">Vocabulary</span>
      </button>
      <button id="openTestBtn" class="menu-btn" type="button">
        <span class="menu-title">Test</span>
      </button>
    </div>
  </section>

  <section id="vocabularyPage" class="card hidden">
    <h2>Vocabulary</h2>
    <div id="vocabBookChoices" class="book-grid"></div>
    <div id="vocabDayControls" class="hidden">
      <div class="day-select-row">
        <label for="vocabDaySelect">Day 선택</label>
        <select id="vocabDaySelect"></select>
      </div>
      <div class="toolbar">
        <button id="prevVocabDayBtn" class="secondary-btn" type="button">이전 Day</button>
        <div id="vocabDayTitle" class="vocab-day-title"></div>
        <button id="nextVocabDayBtn" class="secondary-btn" type="button">다음 Day</button>
      </div>
    </div>
    <div id="vocabularyTableArea" class="word-table-wrap hidden">
      <table>
        <thead>
          <tr><th>No.</th><th>English</th><th>한국어</th></tr>
        </thead>
        <tbody id="vocabTableBody"></tbody>
      </table>
    </div>
  </section>

  <section id="adminPage" class="card hidden">
    <h2>Admin Settings</h2>
    <p class="section-note">새 단어 파트 CSV를 GitHub에 추가하면 코드의 <strong>VOCAB_BOOKS</strong> 배열에 CSV 경로를 하나 더 넣으면 됩니다.</p>
    <div id="bookConfigList"></div>
    <button id="adminRefreshBtn" class="primary-btn full" type="button">GitHub CSV 새로고침</button>
    <div id="uploadStatus" class="status"></div>
  </section>

  <section id="testSetupPage" class="card hidden">
    <h2>Test</h2>
    <div class="selector-grid">
      <div class="check-panel">
        <div class="check-panel-title">단어장 선택</div>
        <div id="bookCheckboxes" class="check-list"></div>
      </div>
      <div class="check-panel">
        <div class="check-panel-title">Day 범위</div>
        <div id="dayRangeControls" class="range-list"></div>
      </div>
    </div>
    <div id="selectedScope" class="section-note"></div>
    <div class="form-group">
      <label for="questionCount">문제 수</label>
      <input id="questionCount" type="number" min="1" value="4" />
    </div>
    <div class="form-group">
      <label for="quizType">시험 유형</label>
      <select id="quizType">
        <option value="multiple">객관식</option>
        <option value="typing">주관식</option>
      </select>
    </div>
    <div class="form-group">
      <label for="direction">출제 방향</label>
      <select id="direction">
        <option value="engToKor">영어 → 한국어</option>
        <option value="korToEng">한국어 → 영어</option>
      </select>
    </div>
    <button id="startBtn" class="primary-btn full" type="button">시험 시작</button>
    <div id="testStatus" class="status"></div>
  </section>

  <section id="quizPage" class="card hidden">
    <div id="progress" class="progress"></div>
    <div id="questionMeta" class="progress"></div>
    <div id="questionWord" class="question-word"></div>
    <div id="multipleChoiceArea" class="choices"></div>
    <div id="typingArea" class="hidden">
      <input id="typingAnswer" type="text" placeholder="정답을 입력하세요" autocomplete="off" />
    </div>
    <div class="navigation">
      <button id="prevBtn" class="secondary-btn" type="button">이전 문제</button>
      <button id="nextBtn" class="primary-btn" type="button">다음 문제</button>
    </div>
  </section>

  <section id="resultPage" class="card hidden">
    <h2>Result</h2>
    <div id="score" class="score"></div>
    <div id="answerSheet"></div>
    <div class="result-actions">
      <button id="retryWrongBtn" class="danger-btn" type="button">오답 다시 풀기</button>
      <button id="newTestBtn" class="primary-btn" type="button">새 시험 설정</button>
    </div>
  </section>
</main>

<script>
const ADMIN_PASSWORD="7356";
const DAY_SIZE=40;
const DATA_REFRESH_INTERVAL_MS=60000;
const VOCAB_BOOKS=[
  {
    id:"idiom",
    title:"Idiom Part",
    type:"csv",
    url:"https://raw.githubusercontent.com/Asher0428/vocabulary/refs/heads/main/idioms.csv"
  },
  {
    id:"word",
    title:"Word Part",
    type:"csv",
    url:"https://raw.githubusercontent.com/Asher0428/vocabulary/refs/heads/main/words.csv"
  }
];

let wordList=[],questions=[],currentIndex=0,answers=[],choiceSets=[],quizType="multiple",direction="engToKor";
let selectedBookIds=new Set(VOCAB_BOOKS.map(book=>book.id));
let selectedDayRanges={};
let activePool=[];
let activeVocabularyBookId=null;
let activeVocabularyDay=1;
let lastVocabularyRefreshAt=0;
let vocabularyLoadPromise=null;

const $=id=>document.getElementById(id);
const pages=[$("homePage"),$("vocabularyPage"),$("adminPage"),$("testSetupPage"),$("quizPage"),$("resultPage")];

function showPage(page){
  pages.forEach(p=>p.classList.add("hidden"));
  page.classList.remove("hidden");
  $("homeBtn").classList.toggle("hidden",page===$("homePage"));
  $("adminSettingsBtn").classList.toggle("hidden",page!==$("homePage"));
  closeAdminAuth();
  window.scrollTo({top:0,behavior:"smooth"});
}
function openAdminSettings(){
  $("adminPasswordInput").value="";
  $("adminPasswordStatus").className="status";
  $("adminPasswordStatus").textContent="";
  $("adminAuthModal").classList.remove("hidden");
  setTimeout(()=>$("adminPasswordInput").focus(),30);
}
function closeAdminAuth(){
  $("adminAuthModal").classList.add("hidden");
}
function confirmAdminPassword(){
  if($("adminPasswordInput").value!==ADMIN_PASSWORD){
    $("adminPasswordStatus").className="status error";
    $("adminPasswordStatus").textContent="비밀번호가 올바르지 않습니다.";
    $("adminPasswordInput").select();
    return;
  }
  closeAdminAuth();
  renderAdmin();
  $("uploadStatus").textContent="";
  showPage($("adminPage"));
}
function normalizeText(t){return String(t??"").trim().toLowerCase().replace(/\s+/g,"")}
function escapeHtml(t){
  const d=document.createElement("div");
  d.textContent=String(t??"");
  return d.innerHTML;
}
function shuffleArray(a){
  const c=[...a];
  for(let i=c.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [c[i],c[j]]=[c[j],c[i]];
  }
  return c;
}
function parseCsvText(text){
  const firstLine=(text.split(/\r?\n/)[0]||"");
  const delimiter=firstLine.includes("\t")&&!firstLine.includes(",")?"\t":",";
  const rows=[];
  let row=[],cell="",inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQuotes){
      if(ch==="\""&&text[i+1]==="\""){
        cell+="\"";
        i++;
      }else if(ch==="\""){
        inQuotes=false;
      }else{
        cell+=ch;
      }
    }else if(ch==="\""){
      inQuotes=true;
    }else if(ch===delimiter){
      row.push(cell);
      cell="";
    }else if(ch==="\n"){
      row.push(cell);
      rows.push(row);
      row=[];
      cell="";
    }else if(ch!=="\r"){
      cell+=ch;
    }
  }
  if(cell!==""||row.length){
    row.push(cell);
    rows.push(row);
  }
  return rows;
}
function parseWordRows(rows){
  if(!Array.isArray(rows)||!rows.length)return[];
  const cleaned=rows.filter(r=>Array.isArray(r)&&r.some(c=>String(c??"").trim()!==""));
  if(!cleaned.length)return[];
  const header=cleaned[0].map(c=>String(c??"").trim().toLowerCase().replace(/\s+/g,""));
  const englishHeaders=["영어단어","영어","english","word","vocabulary","phrase","idiom"];
  const koreanHeaders=["한국어뜻","한국어","뜻","korean","meaning","mean"];
  const numberHeaders=["no.","no","number","번호"];
  const englishIndex=header.findIndex(value=>englishHeaders.includes(value));
  const koreanIndex=header.findIndex(value=>koreanHeaders.includes(value));
  const hasHeader=englishIndex>=0&&koreanIndex>=0;
  const data=hasHeader?cleaned.slice(1):cleaned;
  const fallbackEnglishIndex=numberHeaders.includes(header[0])?1:0;
  const fallbackKoreanIndex=numberHeaders.includes(header[0])?2:1;
  const sourceEnglishIndex=hasHeader?englishIndex:fallbackEnglishIndex;
  const sourceKoreanIndex=hasHeader?koreanIndex:fallbackKoreanIndex;
  const parsed=data
    .map(r=>({english:String(r[sourceEnglishIndex]??"").trim(),korean:String(r[sourceKoreanIndex]??"").trim()}))
    .filter(w=>w.english&&w.korean);
  const unique=[],seen=new Set();
  parsed.forEach(w=>{
    const key=`${normalizeText(w.english)}|${normalizeText(w.korean)}`;
    if(!seen.has(key)){
      seen.add(key);
      unique.push(w);
    }
  });
  return unique;
}
function decorateWords(book,words){
  return words.map((word,index)=>({
    ...word,
    bookId:book.id,
    bookTitle:book.title,
    day:Math.floor(index/DAY_SIZE)+1,
    number:index+1
  }));
}
function freshCsvUrl(url){
  const glue=url.includes("?")?"&":"?";
  return `${url}${glue}v=${Date.now()}`;
}
async function loadVocabularyBooks(options={}){
  if(vocabularyLoadPromise)return vocabularyLoadPromise;
  const silent=options.silent===true;
  const uploadStatus=$("uploadStatus");
  vocabularyLoadPromise=(async()=>{
    if(!silent&&uploadStatus){
      uploadStatus.className="status";
      uploadStatus.textContent="단어장을 불러오는 중입니다.";
    }
    const loaded=[];
    const failedBooks=[];
    for(const book of VOCAB_BOOKS){
      try{
        if(book.type==="csv"){
          const response=await fetch(freshCsvUrl(book.url),{cache:"no-store"});
          if(!response.ok)throw new Error(`${book.title} HTTP ${response.status}`);
          const csvText=await response.text();
          const words=parseWordRows(parseCsvText(csvText));
          if(!words.length)throw new Error(`${book.title} is empty`);
          loaded.push(...decorateWords(book,words));
        }else{
          loaded.push(...decorateWords(book,book.words));
        }
      }catch(e){
        failedBooks.push(book.title);
        console.error(e);
      }
    }
    if(!loaded.length)throw new Error("empty");
    wordList=loaded;
    lastVocabularyRefreshAt=Date.now();
    syncSelectionsAfterLoad();
    renderAll();
    if(uploadStatus){
      uploadStatus.className=failedBooks.length?"status error":"status success";
      uploadStatus.textContent=failedBooks.length
        ? `${getBookSummaries().join(" · ")} 불러옴 · 실패: ${failedBooks.join(", ")}`
        : `${getBookSummaries().join(" · ")} 불러옴`;
    }
    return true;
  })();
  try{
    return await vocabularyLoadPromise;
  }catch(e){
    if(!silent&&uploadStatus){
        uploadStatus.className="status error";
        uploadStatus.textContent="GitHub CSV를 불러오지 못했습니다.";
    }
    console.error(e);
    return false;
  }finally{
    vocabularyLoadPromise=null;
  }
}
function refreshVocabularyIfStale(){
  if(Date.now()-lastVocabularyRefreshAt<DATA_REFRESH_INTERVAL_MS)return;
  loadVocabularyBooks({silent:true});
}
function syncSelectionsAfterLoad(){
  const availableBooks=new Set(VOCAB_BOOKS.map(book=>book.id));
  selectedBookIds=new Set([...selectedBookIds].filter(id=>availableBooks.has(id)));
  if(!selectedBookIds.size)selectedBookIds=new Set(VOCAB_BOOKS.map(book=>book.id));
  syncDayRanges();
}
function getBookSummaries(){
  return VOCAB_BOOKS.map(book=>{
    const count=wordList.filter(word=>word.bookId===book.id).length;
    return `${book.title} ${count}개`;
  });
}
function getBookDays(bookId){
  return [...new Set(wordList.filter(word=>word.bookId===bookId).map(word=>word.day))].sort((a,b)=>a-b);
}
function syncDayRanges(){
  const nextRanges={};
  VOCAB_BOOKS.forEach(book=>{
    const current=selectedDayRanges[book.id]||{start:"",end:""};
    nextRanges[book.id]={start:String(current.start??""),end:String(current.end??"")};
  });
  selectedDayRanges=nextRanges;
}
function getValidatedDayRange(bookId,requireStart=false){
  const days=getBookDays(bookId);
  const min=days[0]||1;
  const max=days[days.length-1]||1;
  const book=VOCAB_BOOKS.find(item=>item.id===bookId);
  const range=selectedDayRanges[bookId]||{start:"",end:""};
  const startText=String(range.start??"").trim();
  const endText=String(range.end??"").trim();
  if(!startText){
    return requireStart
      ? {error:`${book?.title||bookId}의 시작 Day를 입력하세요.`}
      : {empty:true};
  }
  const start=Number(startText);
  const end=endText?Number(endText):start;
  if(!Number.isInteger(start)||!Number.isInteger(end)){
    return {error:`${book?.title||bookId}의 Day는 숫자로 입력하세요.`};
  }
  if(start<min||start>max||end<min||end>max){
    return {error:`${book?.title||bookId}의 Day는 ${min}부터 ${max} 사이로 입력하세요.`};
  }
  if(end<start){
    return {error:`${book?.title||bookId}의 끝 Day는 시작 Day 이상의 Day를 골라주세요.`};
  }
  return {start,end};
}
function getSelectedWords(requireStart=false){
  const words=[];
  for(const bookId of selectedBookIds){
    const range=getValidatedDayRange(bookId,requireStart);
    if(range.error)return {words:[],error:range.error};
    if(range.empty)continue;
    words.push(...wordList.filter(word=>word.bookId===bookId&&word.day>=range.start&&word.day<=range.end));
  }
  return {words};
}
function renderVocabularyChoices(){
  const box=$("vocabBookChoices");
  box.innerHTML="";
  VOCAB_BOOKS.forEach(book=>{
    const count=wordList.filter(word=>word.bookId===book.id).length;
    const button=document.createElement("button");
    button.type="button";
    button.className="menu-btn";
    button.innerHTML=`<span class="menu-title">${escapeHtml(book.title)}</span><span class="menu-desc">${count}개 단어 · ${Math.max(1,Math.ceil(count/DAY_SIZE))} days</span>`;
    button.onclick=()=>{
      activeVocabularyBookId=book.id;
      activeVocabularyDay=1;
      renderVocabulary();
    };
    box.appendChild(button);
  });
}
function renderRows(tableBody,words){
  tableBody.innerHTML="";
  words.forEach((w,i)=>{
    const r=document.createElement("tr");
    r.innerHTML=`<td>${i+1}</td><td>${escapeHtml(w.english)}</td><td>${escapeHtml(w.korean)}</td>`;
    tableBody.appendChild(r);
  });
}
function renderVocabulary(){
  renderVocabularyChoices();
  if(!activeVocabularyBookId){
    $("vocabDayControls").classList.add("hidden");
    $("vocabularyTableArea").classList.add("hidden");
    $("vocabTableBody").innerHTML="";
    return;
  }
  const bookWords=wordList.filter(word=>word.bookId===activeVocabularyBookId);
  const days=[...new Set(bookWords.map(word=>word.day))].sort((a,b)=>a-b);
  if(!days.includes(activeVocabularyDay))activeVocabularyDay=days[0]||1;
  renderVocabularyDaySelect(days);
  const selected=bookWords.filter(word=>word.day===activeVocabularyDay);
  const book=VOCAB_BOOKS.find(item=>item.id===activeVocabularyBookId);
  $("vocabDayTitle").textContent=`${book?.title||"Vocabulary"} · Day ${activeVocabularyDay}`;
  $("prevVocabDayBtn").disabled=days.indexOf(activeVocabularyDay)<=0;
  $("nextVocabDayBtn").disabled=days.indexOf(activeVocabularyDay)===days.length-1;
  renderRows($("vocabTableBody"),selected);
  $("vocabDayControls").classList.remove("hidden");
  $("vocabularyTableArea").classList.remove("hidden");
}
function renderVocabularyDaySelect(days){
  const select=$("vocabDaySelect");
  select.innerHTML="";
  days.forEach(day=>{
    const option=document.createElement("option");
    option.value=String(day);
    option.textContent=`Day ${day}`;
    select.appendChild(option);
  });
  select.value=String(activeVocabularyDay);
}
function moveVocabularyDay(step){
  if(!activeVocabularyBookId)return;
  const days=[...new Set(wordList.filter(word=>word.bookId===activeVocabularyBookId).map(word=>word.day))].sort((a,b)=>a-b);
  const index=days.indexOf(activeVocabularyDay);
  const next=days[index+step];
  if(next){
    activeVocabularyDay=next;
    renderVocabulary();
  }
}
function renderAdmin(){
  const box=$("bookConfigList");
  box.innerHTML="";
  VOCAB_BOOKS.forEach(book=>{
    const count=wordList.filter(word=>word.bookId===book.id).length;
    const div=document.createElement("div");
    div.className="section-note";
    div.innerHTML=`<span class="meta-pill">${escapeHtml(book.title)}</span><span class="meta-pill">${count} words</span>${book.url?escapeHtml(book.url):"내장 단어장"}`;
    box.appendChild(div);
  });
}
function renderSelectors(){
  syncDayRanges();
  const bookBox=$("bookCheckboxes");
  bookBox.innerHTML="";
  VOCAB_BOOKS.forEach(book=>{
    const count=wordList.filter(word=>word.bookId===book.id).length;
    const label=document.createElement("label");
    label.className="check-item";
    label.innerHTML=`<input type="checkbox" value="${book.id}" ${selectedBookIds.has(book.id)?"checked":""}> <span>${escapeHtml(book.title)} (${count})</span>`;
    label.querySelector("input").onchange=e=>{
      if(e.target.checked)selectedBookIds.add(book.id);
      else selectedBookIds.delete(book.id);
      if(!selectedBookIds.size)selectedBookIds.add(book.id);
      renderSelectors();
    };
    bookBox.appendChild(label);
  });

  const rangeBox=$("dayRangeControls");
  rangeBox.innerHTML="";
  [...selectedBookIds].forEach(bookId=>{
    const book=VOCAB_BOOKS.find(item=>item.id===bookId);
    const days=getBookDays(bookId);
    const min=days[0]||1;
    const max=days[days.length-1]||1;
    const range=selectedDayRanges[bookId]||{start:"",end:""};
    const item=document.createElement("div");
    item.className="range-item";
    item.innerHTML=`
      <div class="range-title">${escapeHtml(book?.title||bookId)} <span class="meta-pill">Day ${min} - Day ${max}</span></div>
      <div class="range-controls">
        <input class="day-start-input" type="number" min="${min}" max="${max}" value="${escapeHtml(range.start)}" placeholder="시작" aria-label="${escapeHtml(book?.title||bookId)} 시작 Day">
        <span>~</span>
        <input class="day-end-input" type="number" min="${min}" max="${max}" value="${escapeHtml(range.end)}" placeholder="끝" aria-label="${escapeHtml(book?.title||bookId)} 끝 Day">
      </div>
    `;
    const startInput=item.querySelector(".day-start-input");
    const endInput=item.querySelector(".day-end-input");
    const applyRange=()=>{
      selectedDayRanges[bookId]={start:startInput.value,end:endInput.value};
      updateScope();
    };
    startInput.onchange=applyRange;
    endInput.onchange=applyRange;
    startInput.oninput=applyRange;
    endInput.oninput=applyRange;
    rangeBox.appendChild(item);
  });
  updateScope();
}
function updateScope(){
  const result=getSelectedWords(false);
  if(result.error){
    $("selectedScope").textContent=result.error;
    $("questionCount").max=1;
    return;
  }
  const selected=result.words;
  $("selectedScope").textContent=selected.length
    ? `선택된 범위: ${selected.length}개 단어`
    : "시작 Day를 입력하면 범위가 계산됩니다.";
  $("questionCount").max=Math.max(1,selected.length);
  if(Number($("questionCount").value)>selected.length)$("questionCount").value=selected.length||1;
}
function renderAll(){
  renderVocabulary();
  renderAdmin();
  renderSelectors();
}
function getQuestionText(w){return direction==="engToKor"?w.english:w.korean}
function getCorrectAnswer(w){return direction==="engToKor"?w.korean:w.english}
function buildChoiceSet(current,pool){
  const correct=getCorrectAnswer(current);
  const wrong=shuffleArray(
    pool
      .filter(w=>normalizeText(w.english)!==normalizeText(current.english))
      .map(getCorrectAnswer)
      .filter(a=>normalizeText(a)!==normalizeText(correct))
  );
  const unique=[],seen=new Set();
  wrong.forEach(a=>{
    const key=normalizeText(a);
    if(!seen.has(key)){
      seen.add(key);
      unique.push(a);
    }
  });
  return shuffleArray([correct,...unique.slice(0,3)]);
}
function startQuiz(custom=null){
  const status=$("testStatus");
  status.className="status";
  status.textContent="";
  quizType=$("quizType").value;
  direction=$("direction").value;
  const selection=custom?{words:custom}:getSelectedWords(true);
  if(selection.error){
    status.className="status error";
    status.textContent=selection.error;
    return;
  }
  const pool=selection.words;
  if(!pool.length){
    status.className="status error";
    status.textContent="단어장과 Day를 하나 이상 선택하세요.";
    return;
  }
  const count=custom?pool.length:Number($("questionCount").value);
  if(!Number.isInteger(count)||count<1||count>pool.length){
    status.className="status error";
    status.textContent=`문제 수는 1개부터 ${pool.length}개 사이로 입력하세요.`;
    return;
  }
  if(quizType==="multiple"&&pool.length<2){
    status.className="status error";
    status.textContent="객관식 시험에는 최소 2개 이상의 단어가 필요합니다.";
    return;
  }
  activePool=pool;
  questions=custom?shuffleArray(pool):shuffleArray(pool).slice(0,count);
  currentIndex=0;
  answers=new Array(questions.length).fill("");
  choiceSets=questions.map(w=>quizType==="multiple"?buildChoiceSet(w,pool):[]);
  showPage($("quizPage"));
  renderQuestion();
}
function saveTyping(){
  if(quizType==="typing")answers[currentIndex]=$("typingAnswer").value;
}
function renderQuestion(){
  const q=questions[currentIndex];
  $("progress").textContent=`${currentIndex+1} / ${questions.length}`;
  $("questionMeta").textContent=`${q.bookTitle} · Day ${q.day}`;
  $("questionWord").textContent=getQuestionText(q);
  $("prevBtn").disabled=currentIndex===0;
  $("nextBtn").textContent=currentIndex===questions.length-1?"제출하기":"다음 문제";
  if(quizType==="multiple"){
    $("multipleChoiceArea").classList.remove("hidden");
    $("typingArea").classList.add("hidden");
    const area=$("multipleChoiceArea");
    area.innerHTML="";
    choiceSets[currentIndex].forEach(choice=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="choice-btn";
      b.textContent=choice;
      if(answers[currentIndex]===choice)b.classList.add("selected");
      b.onclick=()=>{
        answers[currentIndex]=choice;
        area.querySelectorAll(".choice-btn").forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected");
      };
      area.appendChild(b);
    });
  }else{
    $("multipleChoiceArea").classList.add("hidden");
    $("typingArea").classList.remove("hidden");
    $("typingAnswer").value=answers[currentIndex]||"";
    setTimeout(()=>$("typingAnswer").focus(),30);
  }
}
function submitQuiz(){
  saveTyping();
  const data=questions.map((w,i)=>{
    const userAnswer=answers[i]||"";
    const correctAnswer=getCorrectAnswer(w);
    return{word:w,question:getQuestionText(w),userAnswer,correctAnswer,isCorrect:normalizeText(userAnswer)===normalizeText(correctAnswer)};
  });
  $("score").textContent=`${data.filter(x=>x.isCorrect).length} / ${questions.length}`;
  const sheet=$("answerSheet");
  sheet.innerHTML="";
  data.forEach((x,i)=>{
    const box=document.createElement("div");
    box.className=`answer-item ${x.isCorrect?"correct":"wrong"}`;
    box.innerHTML=`<p><strong>${i+1}. ${escapeHtml(x.question)}</strong></p><p>${escapeHtml(x.word.bookTitle)} · Day ${x.word.day}</p><p>내 답: ${escapeHtml(x.userAnswer||"미응답")}</p><p>정답: ${escapeHtml(x.correctAnswer)}</p><p>결과: ${x.isCorrect?"정답":"오답"}</p>`;
    sheet.appendChild(box);
  });
  const wrong=data.filter(x=>!x.isCorrect).map(x=>x.word);
  $("retryWrongBtn").disabled=wrong.length===0;
  $("retryWrongBtn").textContent=wrong.length===0?"모든 문제를 맞혔습니다":`오답 ${wrong.length}개 다시 풀기`;
  $("retryWrongBtn").onclick=()=>wrong.length&&startQuiz(wrong);
  showPage($("resultPage"));
}

$("homeBtn").onclick=()=>showPage($("homePage"));
$("adminSettingsBtn").onclick=openAdminSettings;
$("cancelAdminAuthBtn").onclick=closeAdminAuth;
$("confirmAdminAuthBtn").onclick=confirmAdminPassword;
$("adminPasswordInput").onkeydown=e=>{
  if(e.key==="Enter")confirmAdminPassword();
  if(e.key==="Escape")closeAdminAuth();
};
$("openVocabularyBtn").onclick=async()=>{
  renderVocabulary();
  showPage($("vocabularyPage"));
  await loadVocabularyBooks({silent:true});
  renderVocabulary();
};
$("openTestBtn").onclick=async()=>{
  renderSelectors();
  $("testStatus").className="status";
  $("testStatus").textContent="최신 단어장을 확인하는 중입니다.";
  showPage($("testSetupPage"));
  await loadVocabularyBooks({silent:true});
  $("testStatus").textContent="";
  renderSelectors();
};
$("adminRefreshBtn").onclick=()=>loadVocabularyBooks();
$("prevVocabDayBtn").onclick=()=>moveVocabularyDay(-1);
$("nextVocabDayBtn").onclick=()=>moveVocabularyDay(1);
$("vocabDaySelect").onchange=e=>{
  activeVocabularyDay=Number(e.target.value);
  renderVocabulary();
};
$("startBtn").onclick=async()=>{
  $("testStatus").className="status";
  $("testStatus").textContent="최신 단어장을 확인하는 중입니다.";
  await loadVocabularyBooks({silent:true});
  startQuiz();
};
$("prevBtn").onclick=()=>{
  saveTyping();
  if(currentIndex>0){
    currentIndex--;
    renderQuestion();
  }
};
$("nextBtn").onclick=()=>{
  saveTyping();
  if(currentIndex<questions.length-1){
    currentIndex++;
    renderQuestion();
  }else{
    submitQuiz();
  }
};
$("typingAnswer").onkeydown=e=>{
  if(e.key==="Enter")$("nextBtn").click();
};
$("newTestBtn").onclick=()=>showPage($("testSetupPage"));

renderAll();
loadVocabularyBooks();
window.addEventListener("focus",refreshVocabularyIfStale);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)refreshVocabularyIfStale();
});
</script>
</body>
